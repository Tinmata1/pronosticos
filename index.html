const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function abrir(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(S.i)},key,u8(S.c));
 return new TextDecoder().decode(pt)}
function mostrar(html){document.open();document.write(html);document.close()}
(async()=>{let k=null;try{k=localStorage.getItem('llave-sitio')}catch(e){}
 if(k){try{mostrar(await abrir(await crypto.subtle.importKey('raw',u8(k),'AES-GCM',false,['decrypt'])));return}
