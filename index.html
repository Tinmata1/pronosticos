const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function abrir(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(S.i)},key,u8(S.c));
 return new TextDecoder().decode(pt)}
function mostrar(html){document.open();document.write(html);document.close()}
(async()=>{let k=null;try{k=localStorage.getItem('llave-sitio')}catch(e){}
 if(k){try{mostrar(await abrir(await crypto.subtle.importKey('raw',u8(k),'AES-GCM',false,['decrypt'])));return}
  catch(e){try{localStorage.removeItem('llave-sitio')}catch(_){}}}
 const f=document.getElementById('f');f.hidden=false;document.getElementById('c').focus();
 f.addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='Abriendo…';
  try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('c').value),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(S.s),iterations:S.n,hash:'SHA-256'},base,
    {name:'AES-GCM',length:256},true,['decrypt']);
   const html=await abrir(key);
   if(document.getElementById('r').checked){try{localStorage.setItem('llave-sitio',b64(await crypto.subtle.exportKey('raw',key)))}catch(_){}}
   mostrar(html)}catch(err){e.textContent='Contraseña incorrecta.'}})})();
